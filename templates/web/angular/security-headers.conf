# Included in the server block and in every location that sets its own
# add_header, because nginx drops inherited add_header directives in any
# location that declares one. entrypoint.sh fills in the two placeholders at
# start: the API origin from API_URL, and the hashes of any inline scripts the
# build wrote into its HTML.
#
# style-src allows inline styles because the SDK and the frameworks inject
# <style> elements at runtime. Scripts stay limited to this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'__SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'__API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
