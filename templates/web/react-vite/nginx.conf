server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  location /health {
    access_log off;
    add_header Content-Type text/plain;
    include /etc/nginx/seamless/security-headers.conf;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;

    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/seamless/security-headers.conf;

    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
    include /etc/nginx/seamless/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }

  # Every location that sets its own add_header repeats this include. See
  # security-headers.conf.
  include /etc/nginx/seamless/security-headers.conf;

  gzip on;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/xml
    application/xml
    application/xml+rss
    text/javascript;
  gzip_min_length 256;

  access_log /dev/stdout;
  error_log /dev/stderr;
}