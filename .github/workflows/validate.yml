name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate registry and manifests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      # shared/react-app is copied byte for byte into every template, so it has
      # to be stored already formatted the way those templates format their own
      # source. Formatted from anywhere else, or with a different prettier, the
      # copies land mis-formatted and each template's format:check fails on files
      # nobody edited.
      - name: Format check (shared/react-app)
        run: npm run format:shared:check

      - name: Templates are in sync with shared/react-app
        run: npm run sync:shared -- --check

      - name: Compute build matrix
        id: matrix
        run: echo "matrix=$(node scripts/validate-templates.mjs --matrix)" >> "$GITHUB_OUTPUT"

  # Every step is --if-present so a template that has not adopted one of these yet
  # is skipped rather than failed. A template that does declare the script has to
  # pass it: this is the same gate `npm run check` gives a user locally.
  template-checks:
    name: Check ${{ matrix.id }}
    needs: validate
    if: needs.validate.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Format check
        run: npm run format:check --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present
