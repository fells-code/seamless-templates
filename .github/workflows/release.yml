name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'fells-code/seamless-templates'
    name: Version or tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # On a push to main: open or update the "version packages" PR when changesets are pending;
      # once that PR merges (version bumped, changesets consumed), the publish step tags the
      # commit as v<version>, which is the ref the CLI pins, and publishes a GitHub Release for
      # that tag with notes from CHANGELOG.md. Nothing is published to npm. createGithubReleases
      # is left off because the Changesets action cannot target the v-prefixed tag scheme; the
      # publish step (scripts/tag-release.mjs) creates the release via the gh CLI instead.
      - name: Version or tag
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run version-packages
          publish: npm run release:stable
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
